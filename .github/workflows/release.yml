name: Release

on:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish generated release branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devel'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release artifacts
        run: npm run package:check

      - name: Publish dist to release branch
        shell: bash
        run: |
          set -euo pipefail

          release_tree="$(mktemp -d)"
          cp -R dist/. "$release_tree"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_release_tag() {
            git tag -f release
            git push --force origin refs/tags/release
          }

          git fetch origin release || true
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            git switch --track -c release origin/release
          else
            git switch --orphan release
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$release_tree"/. .
          git add -A

          if git diff --cached --quiet; then
            echo "Release branch is already up to date."
            publish_release_tag
            exit 0
          fi

          git commit \
            -m "chore: publish release artifacts from ${GITHUB_SHA}" \
            -m "Co-authored-by: Codex <codex@openai.com>"
          git push origin HEAD:release
          publish_release_tag
